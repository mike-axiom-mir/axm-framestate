[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axm-framestate"
version = "0.1.0"
description = "Standalone deterministic video creation and growth machine"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "AXM"}]
dependencies = []

[project.scripts]
framestate = "axm_framestate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
