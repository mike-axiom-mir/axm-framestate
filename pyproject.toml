[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axm-framestate"
version = "0.13.0"
description = "Standalone deterministic video creation and growth machine"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "AXM"}]
dependencies = []

[project.scripts]
framestate = "axm_framestate.cli:main"
framestate-studio = "axm_framestate.studio:main"
framestate-render-resume = "axm_framestate.resumable:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
axm_framestate = ["studio_ui/*.html", "studio_ui/*.css", "studio_ui/*.js"]
