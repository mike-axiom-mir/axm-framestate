name: Recovery snapshot integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing media compatibility boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install Pillow==12.3.0
      - name: Verify recovery snapshot contract
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_snapshot_contract -v
      - name: Verify complete current suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
