name: MergeAgent public discovery v0.16 regeneration

on:
  push:
    branches:
      - integration/public-discovery-v016-20260912

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message != 'MergeAgent regenerate public discovery for v0.16'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/public-discovery-v016-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore proven discovery donor files
        run: |
          git fetch origin automation/capability-weaver-framestate-public-discovery-v0-1
          for path in .axm/discovery-public.json .github/workflows/public-capability-discovery.yml DISCOVERY.md tests/test_public_capability_discovery.py tools/generate_public_capabilities.py; do
            mkdir -p "$(dirname "$path")"
            git show "origin/automation/capability-weaver-framestate-public-discovery-v0-1:$path" > "$path"
          done
      - name: Adapt donor contract to current v0.16 truth
        run: python tools/mergeagent_regenerate_discovery_v016.py
      - name: Regenerate and verify public evidence
        run: |
          python tools/generate_public_capabilities.py --write
          python tools/generate_public_capabilities.py --check
          python -m unittest discover -s tests -p 'test_public_capability_discovery.py' -v
          PYTHONPATH=src python -m axm_framestate capabilities > /tmp/framestate-capabilities.json
          python -c "import json; from pathlib import Path; c=json.loads(Path('/tmp/framestate-capabilities.json').read_text()); r=json.loads(Path('registry/capabilities.jsonl').read_text()); assert c['schema']=='axm.framestate.capability-map/v0.16'; assert all(c['capabilities'][k]['status']=='tested' for k in ['dependency-free-core-package','media-output-confinement','forge-single-writer-publication','render-checkpoint-integrity','renderer-neutral-visual-state-bridge','echoworld-replay-visual-bridge','caller-pinned-render-output-verification']); assert r['runtime']['dependencies']==0; assert r['runtime']['declaredPackageDependencies']==0; assert r['runtime']['externalPythonPackages']==[]; assert r['contracts']['currentCliImportBoundary']=='dependency-free-core-lazy-optional-media-v0.16'"
          git diff --check
      - name: Commit regenerated discovery and remove staging machinery
        run: |
          git config user.name 'AXM MergeAgent'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/mergeagent-public-discovery-v016.yml tools/mergeagent_regenerate_discovery_v016.py
          git add .axm/discovery-public.json .github/workflows/public-capability-discovery.yml DISCOVERY.md registry/capabilities.jsonl registry/capabilities.receipt.json src/axm_framestate/capabilities.py tests/test_public_capability_discovery.py tools/generate_public_capabilities.py
          git diff --cached --check
          git commit -m 'MergeAgent regenerate public discovery for v0.16'
          git push origin HEAD:integration/public-discovery-v016-20260912
