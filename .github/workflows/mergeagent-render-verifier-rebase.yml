name: MergeAgent current-main render verifier rebase

on:
  push:
    branches:
      - integration/render-output-verifier-current-main-20260912

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'MergeAgent rebase render verifier onto current main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/render-output-verifier-current-main-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore already-verified verifier files
        run: |
          git fetch origin integration/render-output-verifier-20260912
          git show origin/integration/render-output-verifier-20260912:src/axm_framestate/render_verify.py > src/axm_framestate/render_verify.py
          git show origin/integration/render-output-verifier-20260912:tests/test_render_output_verification.py > tests/test_render_output_verification.py
      - name: Apply the verified narrow integration edits to current main
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/axm_framestate/render.py',
              "    state['realization']['texture_filter']=str(ropts.get('texture_filter','nearest'))\n    state['state_digest']=digest(state)\n",
              "    state['realization']['texture_filter']=str(ropts.get('texture_filter','nearest'))\n    state.pop('state_digest',None)\n    state['state_digest']=digest(state)\n",
          )
          replace_once(
              'src/axm_framestate/cli.py',
              'from .receipts import render_with_receipt,verify_repeat,render_realized_with_receipt,verify_realized_repeat\n',
              'from .receipts import render_with_receipt,verify_repeat,render_realized_with_receipt,verify_realized_repeat\nfrom .render_verify import verify_render_output\n',
          )
          replace_once(
              'src/axm_framestate/cli.py',
              "    x=sub.add_parser('verify-repeat');x.add_argument('project');x.add_argument('output')\n    x=sub.add_parser('snapshot');x.add_argument('--output-dir')\n",
              "    x=sub.add_parser('verify-repeat');x.add_argument('project');x.add_argument('output')\n    x=sub.add_parser('verify-render');x.add_argument('output');x.add_argument('--receipt-digest',required=True);x.add_argument('--project-digest',required=True)\n    x=sub.add_parser('snapshot');x.add_argument('--output-dir')\n",
          )
          replace_once(
              'src/axm_framestate/cli.py',
              "    elif a.command=='verify-repeat':\n        r=verify_repeat(load_project(Path(a.project)),Path(a.output),root);_print(r);return 0 if r['passed'] else 2\n    elif a.command=='snapshot':_print(create_daily_snapshot(root,output_dir=Path(a.output_dir) if a.output_dir else None))\n",
              "    elif a.command=='verify-repeat':\n        r=verify_repeat(load_project(Path(a.project)),Path(a.output),root);_print(r);return 0 if r['passed'] else 2\n    elif a.command=='verify-render':\n        _print(verify_render_output(Path(a.output),expected_receipt_digest=a.receipt_digest,expected_project_digest=a.project_digest))\n    elif a.command=='snapshot':_print(create_daily_snapshot(root,output_dir=Path(a.output_dir) if a.output_dir else None))\n",
          )
          replace_once(
              '.github/workflows/recovery-snapshot-integrity.yml',
              "      - name: Verify recovery snapshot contract\n        env:\n          PYTHONPATH: src\n        run: python -m unittest tests.test_snapshot_contract -v\n      - name: Verify complete current suite\n",
              "      - name: Verify recovery snapshot contract\n        env:\n          PYTHONPATH: src\n        run: python -m unittest tests.test_snapshot_contract -v\n      - name: Verify caller-pinned render output admission\n        env:\n          PYTHONPATH: src\n        run: python -m unittest tests.test_render_output_verification -v\n      - name: Verify complete current suite\n",
          )
          PY
      - name: Commit exact current-main integration and remove staging workflow
        run: |
          git config user.name 'AXM MergeAgent'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/mergeagent-render-verifier-rebase.yml
          git add src/axm_framestate/render_verify.py tests/test_render_output_verification.py src/axm_framestate/render.py src/axm_framestate/cli.py .github/workflows/recovery-snapshot-integrity.yml
          git diff --cached --check
          git commit -m 'MergeAgent rebase render verifier onto current main'
          git push origin HEAD:integration/render-output-verifier-current-main-20260912
