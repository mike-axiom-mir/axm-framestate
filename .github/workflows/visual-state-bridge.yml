name: Visual state bridge

on:
  pull_request:
    paths:
      - 'src/axm_framestate/visual_state_bridge.py'
      - 'tests/test_visual_state_bridge.py'
      - 'DONOR_NOTES.md'
      - '.github/workflows/visual-state-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framestate-regression:
    name: FrameState Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install main-branch image boundary for the complete legacy suite
        run: python -m pip install pillow
      - name: Compile source and focused bridge tests
        run: |
          python -m compileall -q src tests/test_visual_state_bridge.py
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_visual_state_bridge.py' -v
      - name: Run complete deterministic FrameState suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  universal-creation-interop:
    name: Real Universal Creation compilation -> FrameState realization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FrameState lane
        uses: actions/checkout@v4
      - name: Checkout pinned Universal Creation donor
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-universal-creation
          ref: f765452b4189822b70ff03db014b2beecd55e43a
          path: donor-universal-creation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Produce a real renderer-neutral visual-state compilation
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, 'donor-universal-creation/src')
          from axm_uc.visual_state_prompt_atlas import compile_visual_state

          compiled = compile_visual_state({
              'subject': 'cross-repo capability bridge fixture',
              'commands': ['/8k', '/ultrarealistic', '/cinematic'],
          })
          assert compiled['schema'] == 'axm.visual-state-compilation/v0.1'
          assert compiled['truth_status'] == 'COMPILED_VISUAL_STATE'
          Path('/tmp/compiled-visual-state.json').write_text(
              json.dumps(compiled, sort_keys=True), encoding='utf-8'
          )
          PY
      - name: Consume the donor artifact without importing donor runtime
        run: |
          PYTHONPATH=src python -m axm_framestate.visual_state_bridge \
            examples/adaptive_realization.json \
            /tmp/compiled-visual-state.json \
            examples/machine_high.json > /tmp/bridge-result.json
      - name: Verify bridge truth and native realization contract
        run: |
          python - <<'PY'
          import json

          result = json.load(open('/tmp/bridge-result.json', encoding='utf-8'))
          assert result['schema'] == 'axm.framestate.visual-state-realization-result/v0.1'
          assert result['canonical_project_unchanged'] is True
          assert result['invariant_check']['passed'] is True
          plan = result['bridge_plan']
          assert plan['authority'] == 'NONE'
          assert plan['effective_policy']['min_internal_sample_scale'] >= 2
          assert plan['effective_policy']['preferred_texture_filter'] == 'bilinear'
          assert plan['effective_policy']['min_particle_density_milli'] >= 900
          held = {row['source_path'] for row in plan['held_paths']}
          assert 'projection.resolution_tier' in held
          assert 'appearance.aesthetics' in held
          PY
