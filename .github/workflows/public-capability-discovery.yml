name: FrameState public capability discovery

on:
  pull_request:
    paths:
      - '.axm/discovery-public.json'
      - 'pyproject.toml'
      - 'src/axm_framestate/capabilities.py'
      - 'src/axm_framestate/canonical.py'
      - 'src/axm_framestate/cli.py'
      - 'src/axm_framestate/media.py'
      - 'LICENSE'
      - 'registry/**'
      - 'tools/generate_public_capabilities.py'
      - 'tests/test_public_capability_discovery.py'
      - 'DISCOVERY.md'
      - '.github/workflows/public-capability-discovery.yml'
  push:
    branches: [main]
    paths:
      - '.axm/discovery-public.json'
      - 'pyproject.toml'
      - 'src/axm_framestate/capabilities.py'
      - 'src/axm_framestate/canonical.py'
      - 'src/axm_framestate/cli.py'
      - 'src/axm_framestate/media.py'
      - 'LICENSE'
      - 'registry/**'
      - 'tools/generate_public_capabilities.py'
      - 'tests/test_public_capability_discovery.py'
      - 'DISCOVERY.md'
      - '.github/workflows/public-capability-discovery.yml'

permissions:
  contents: read

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact FrameState source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile public discovery boundary
        run: python -m py_compile tools/generate_public_capabilities.py tests/test_public_capability_discovery.py
      - name: Verify generated capability evidence
        run: python tools/generate_public_capabilities.py --check
      - name: Run focused fail-closed discovery regressions
        run: python -m unittest discover -s tests -p 'test_public_capability_discovery.py' -v
      - name: Install the current v0.10 CLI Pillow compatibility boundary
        run: python -m pip install Pillow==12.3.0
      - name: Verify the real FrameState capability map boundary
        env:
          PYTHONPATH: src
        run: |
          python -m axm_framestate capabilities > /tmp/framestate-capabilities.json
          python - <<'PY'
          import json
          from pathlib import Path

          capability_map = json.loads(Path('/tmp/framestate-capabilities.json').read_text(encoding='utf-8'))
          registry = json.loads(Path('registry/capabilities.jsonl').read_text(encoding='utf-8'))

          assert capability_map['schema'] == 'axm.framestate.capability-map/v0.10'
          assert capability_map['capabilities']['canonical-project-state']['status'] == 'executable'
          assert capability_map['capabilities']['repeat-verification']['status'] == 'tested'
          assert capability_map['capabilities']['adaptive-realization-planner']['status'] == 'tested'
          assert capability_map['capabilities']['mp4-assembly']['status'] == 'external-boundary'
          assert capability_map['capabilities']['human-intelligible-native-speech']['status'] == 'gap'

          assert registry['id'] == 'axm.framestate.local-deterministic-video-machine'
          assert registry['status'] is None
          assert registry['runtime']['dependencies'] == 1
          assert registry['runtime']['declaredPackageDependencies'] == 0
          assert registry['runtime']['externalPythonPackages'] == ['Pillow']
          assert registry['contracts'] == {
              'canonicalProject': 'axm.framestate.project/v0.5',
              'capabilityMap': 'axm.framestate.capability-map/v0.10',
              'currentCliImportBoundary': 'Pillow-required-on-v0.10-main',
          }
          assert registry['authority'] == {
              'automaticInstall': False,
              'automaticSelection': False,
              'canon': False,
              'discoveryOnly': True,
              'execution': False,
              'merge': False,
              'projectMutation': False,
          }
          print(json.dumps({
              'capability': registry['id'],
              'map': capability_map['schema'],
              'status': registry['status'],
              'current_cli_external_python_boundary': registry['runtime']['externalPythonPackages'],
              'authority': 'DISCOVERY_DECLARATION_ONLY',
          }, sort_keys=True))
          PY

  portable-discovery-consumer:
    needs: provider-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact FrameState source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify FrameState generated evidence before external consumption
        run: python tools/generate_public_capabilities.py --check
      - name: Checkout pinned Discovery Buddy source only to build portable artifact
        uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-discovery-buddy
          ref: 565c38ecf93a9d563b02211258d8d36fcb1162b5
          path: .discovery-buddy-source
          persist-credentials: false
      - name: Build and independently verify deterministic Discovery Buddy zipapp
        run: |
          python .discovery-buddy-source/tools/build_portable_discovery.py build \
            --output /tmp/discovery-buddy.pyz \
            --receipt /tmp/discovery-buddy.pyz.receipt.json
          python .discovery-buddy-source/tools/build_portable_discovery.py verify \
            --output /tmp/discovery-buddy.pyz \
            --receipt /tmp/discovery-buddy.pyz.receipt.json
          rm -rf .discovery-buddy-source
          test ! -e .discovery-buddy-source
          PYTHONPATH= PYTHONNOUSERSITE=1 python /tmp/discovery-buddy.pyz --help
      - name: Scan, verify, and query FrameState using only the portable zipapp
        run: |
          PYTHONPATH= PYTHONNOUSERSITE=1 python /tmp/discovery-buddy.pyz scan "$GITHUB_WORKSPACE" \
            --public --output-dir /tmp/framestate-discovery
          PYTHONPATH= PYTHONNOUSERSITE=1 python /tmp/discovery-buddy.pyz verify "$GITHUB_WORKSPACE" \
            --public --output-dir /tmp/framestate-discovery
          PYTHONPATH= PYTHONNOUSERSITE=1 python /tmp/discovery-buddy.pyz query \
            /tmp/framestate-discovery/public-discovery.json \
            --capability-id axm.framestate.local-deterministic-video-machine \
            --provider mike-axiom-mir/axm-framestate > /tmp/framestate-query.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          index = json.loads(Path('/tmp/framestate-discovery/public-discovery.json').read_text(encoding='utf-8'))
          query = json.loads(Path('/tmp/framestate-query.json').read_text(encoding='utf-8'))
          registry = json.loads(Path('registry/capabilities.jsonl').read_text(encoding='utf-8'))

          assert registry['runtime']['dependencies'] == 1
          assert registry['runtime']['declaredPackageDependencies'] == 0
          assert registry['runtime']['externalPythonPackages'] == ['Pillow']

          assert index['schema'] == 'axm.discovery-index/v0.1'
          assert index['visibility'] == 'PUBLIC_SAFE_DECLARED_ONLY'
          assert index['summary']['repositories'] == 1
          assert index['summary']['capability_records'] == 1
          repo = index['repositories'][0]
          assert repo['repo'] == 'mike-axiom-mir/axm-framestate'
          assert 'path' not in repo and 'git' not in repo
          records = repo['capabilities']['records']
          assert len(records) == 1
          assert records[0]['id'] == 'axm.framestate.local-deterministic-video-machine'
          assert records[0]['status'] is None
          assert records[0]['providers'] == ['mike-axiom-mir/axm-framestate']
          assert records[0]['source'] == 'registry/capabilities.jsonl'
          assert records[0]['line'] == 1
          sources = repo['capabilities']['sources']
          assert len(sources) == 1
          assert sources[0]['records'] == 1 and sources[0]['errors'] == 0
          raw_registry = Path('registry/capabilities.jsonl').read_bytes()
          assert sources[0]['sha256'] == hashlib.sha256(raw_registry).hexdigest()

          assert query['schema'] == 'axm.discovery-query/v0.1'
          assert query['summary'] == {'matches': 1}
          assert query['authority'] == {
              'classification': 'DISCOVERY_EVIDENCE_ONLY',
              'execute': False,
              'install': False,
              'select': False,
              'merge': False,
              'canon': False,
          }
          candidate = query['candidates'][0]
          assert candidate['repository'] == 'mike-axiom-mir/axm-framestate'
          assert candidate['capability']['id'] == 'axm.framestate.local-deterministic-video-machine'
          assert candidate['capability']['status'] is None
          print(json.dumps({
              'repositories': index['summary']['repositories'],
              'capability_records': index['summary']['capability_records'],
              'match': candidate['capability']['id'],
              'source_registry_cli_boundary': registry['runtime']['externalPythonPackages'],
              'portable_view_fields': sorted(candidate['capability']),
              'authority': query['authority']['classification'],
              'discovery_source_checkout_present': False,
          }, sort_keys=True))
          PY
      - name: Retain portable discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: framestate-public-capability-evidence
          path: |
            /tmp/framestate-discovery/public-discovery.json
            /tmp/framestate-query.json
            /tmp/discovery-buddy.pyz.receipt.json
            registry/capabilities.jsonl
            registry/capabilities.receipt.json
          if-no-files-found: error
